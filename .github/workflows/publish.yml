name: Publish to Maven Central

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v1.0.0

jobs:
  publish:
    name: Release SDK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Configure GPG key
        run: |
          echo "$SIGNING_KEY" | base64 --decode > private.gpg
          gpg --batch --import private.gpg
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Publish to Sonatype
        run: ./gradlew publish -Psigning.keyId=${{ secrets.SIGNING_KEY_ID }} \
          -Psigning.key="${{ secrets.SIGNING_KEY }}" \
          -Psigning.password="${{ secrets.SIGNING_PASSWORD }}" \
          -PossrhUsername=${{ secrets.OSSRH_USERNAME }} \
          -PossrhPassword=${{ secrets.OSSRH_PASSWORD }}
        env:
          ORG_GRADLE_PROJECT_signing.keyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signing.key: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signing.password: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_ossrhUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_ossrhPassword: ${{ secrets.OSSRH_PASSWORD }}
