name: Lint Kotlin (authmatech)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ktlint:
    name: Run ktlint on authmatech module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Run ktlint check
        run: ./gradlew :authmatech:ktlint --warning-mode=all
